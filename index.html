<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baazar Flyer Editor</title>
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Baazar <span>Flyer Editor</span></div>
  <div class="tools">
    <button data-add="text" title="Add text (T)">＋ Text</button>
    <button data-add="rect" title="Add rectangle (R)">＋ Rectangle</button>
    <button data-add="ellipse" title="Add circle (E)">＋ Circle</button>
    <button data-add="image" title="Add image">＋ Image</button>
    <button data-add="icon" title="Add icon (I)">＋ Icon</button>
    <button data-add="svg" title="Import an SVG file as an editable vector">＋ SVG file</button>
  </div>
  <div class="tools">
    <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
  </div>
  <div class="tools zoom">
    <button id="zoomOut" title="Zoom out (-)">−</button>
    <button id="zoomFit" title="Fit page (0)"><span id="zoomLabel">100%</span></button>
    <button id="zoomIn" title="Zoom in (+)">＋</button>
  </div>
  <div class="tools right">
    <div class="menu">
      <button class="primary" id="exportBtn">Export ▾</button>
      <div class="menu-list" id="exportMenu" hidden>
        <button data-export="png-print">PNG, print quality (300 dpi)</button>
        <button data-export="png-screen">PNG, social / screen</button>
        <button data-export="jpg-print">JPG, print quality (300 dpi)</button>
        <button data-export="pdf">PDF (opens print dialog)</button>
        <button data-export="svg">SVG (vector, opens in Illustrator / Figma)</button>
        <hr>
        <button data-export="save">Save project (.json)</button>
        <button data-export="open">Open project…</button>
        <button data-export="font">Upload a font…</button>
        <hr>
        <button data-export="reset" class="danger">Reset to original template</button>
      </div>
    </div>
  </div>
</header>

<main>
  <aside class="panel" id="layersPanel">
    <div class="panel-head">Layers <small>(top = front)</small></div>
    <div id="layers"></div>
  </aside>

  <section id="stage">
    <div id="pagewrap">
      <svg id="page" xmlns="http://www.w3.org/2000/svg">
        <defs id="defs"></defs>
        <g id="content"></g>
        <g id="overlay"></g>
      </svg>
      <textarea id="inlineEditor" spellcheck="false" hidden></textarea>
    </div>
  </section>

  <aside class="panel" id="propsPanel">
    <div id="props"></div>
  </aside>
</main>

<div class="modal" id="iconModal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <strong id="iconModalTitle">Choose an icon</strong>
      <input id="iconSearch" type="search" placeholder="Search 1,500+ icons (e.g. fish, truck, gift)">
      <button class="close" data-close>✕</button>
    </div>
    <div class="icon-tabs">
      <button data-tab="all" class="on">All</button>
      <button data-tab="brand">Flyer artwork</button>
      <button data-tab="custom">Food &amp; animals</button>
      <button data-tab="lucide">Line icons</button>
    </div>
    <div id="iconGrid"></div>
    <div class="modal-foot"><button id="iconMore">Show more</button></div>
  </div>
</div>

<div class="modal" id="codeModal" hidden>
  <div class="modal-box">
    <div class="modal-head"><strong>Edit SVG code</strong><button class="close" data-close>✕</button></div>
    <textarea id="codeText" spellcheck="false"></textarea>
    <div class="modal-foot"><button id="codeApply" class="primary">Apply</button></div>
  </div>
</div>

<div id="toast" hidden></div>
<div id="printArea"></div>

<input type="file" id="fileImage" accept="image/*" hidden>
<input type="file" id="fileSvg" accept=".svg,image/svg+xml" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileFont" accept=".woff2,.woff,.ttf,.otf" hidden>

<script src="js/data/assets.js"></script>
<script src="js/data/fonts.js"></script>
<script src="js/data/icons.js"></script>
<script src="js/template.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
